name: Create Release

on:
    workflow_dispatch:
        inputs:
            bump:
                description: "Force version bump type"
                required: true
                type: choice
                options:
                    - auto
                    - patch
                    - minor
                    - major
                default: "auto"

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Calculate new version
              id: version
              uses: paulhatch/semantic-version@v6.0.2
              with:
                  tag_prefix: "v"
                  major_pattern: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump == 'major' && '.*' || (github.event_name == 'workflow_dispatch' && github.event.inputs.bump != 'auto' && 'DISABLE_MAJOR' || 'BREAKING CHANGE:') }}
                  minor_pattern: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump == 'minor' && '.*' || (github.event_name == 'workflow_dispatch' && github.event.inputs.bump != 'auto' && 'DISABLE_MINOR' || 'feat:') }}
                  version_format: "${major}.${minor}.${patch}"
                  bump_each_commit: true

            - name: Manage Releases
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  NEW_TAG="v${{ steps.version.outputs.version }}"
                  PREV_TAG="v${{ steps.version.outputs.previous_version }}"

                  if [ "$NEW_TAG" != "$PREV_TAG" ]; then
                      # Delete previous release and its tag
                      if gh release view "$PREV_TAG" &>/dev/null; then
                          gh release delete "$PREV_TAG" --cleanup-tag -y
                      fi

                      # Create the new release
                      gh release create "$NEW_TAG" --generate-notes
                  fi
